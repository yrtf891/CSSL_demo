<title>Patch embeddings</title>
<style>

  .box { position: relative; width: 100%; aspect-ratio: 1.35; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
</style>
</head>
