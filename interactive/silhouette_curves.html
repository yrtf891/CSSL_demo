<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silhouette and noise level</title>
<style>
  :root { --bg: #ffffff; --ink: #17151f; --muted: #6c687e; --line: #e2dfeb; --grid: #eeecf3; --surface: #f4f2f9;
          --lam: #5b45c9; --om: #c23b72; --warm: #f1eff6; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 12px 16px 8px; max-width: 760px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  select:focus-visible { outline: 2px solid var(--lam); outline-offset: 2px; }
  .box { position: relative; width: 100%; }
  svg { display: block; width: 100%; height: auto; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .sw { display: inline-block; width: 16px; height: 2px; margin-right: 6px; vertical-align: 4px; }
  .note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
  text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <label for="run">Run</label>
    <select id="run">
      <option value="monuseg_s0">MoNuSeg, seed 0</option>
      <option value="monuseg_s1">MoNuSeg, seed 1</option>
      <option value="monuseg_s2">MoNuSeg, seed 2</option>
      <option value="chaos_s0">CHAOS, split 0</option>
      <option value="chaos_s1">CHAOS, split 1</option>
      <option value="chaos_s2">CHAOS, split 2</option>
    </select>
  </div>
  <div class="box" id="box">
    <svg id="sv" viewBox="0 0 720 300" role="img" aria-label="Silhouette and noise level over training"></svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  <div class="legend">
    <span><b style="color: var(--lam); margin-right: 6px">━━</b>λ, noise level of the consistency loss</span>
    <span><b style="color: var(--om); margin-right: 6px">━━</b>ω, Silhouette of each batch</span>
  </div>
  <p class="note">Shaded: supervised warm-up (2,000 iterations), before the CSSL losses start. Hover to read values.</p>
</div>
